[build-system]
requires = ["setuptools==83.0.0", "setuptools-scm==10.2.1", "wheel==0.47", "twine==6.2.0", "build==1.5.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "node-and-date"

[project]
name = "tui_log_viewer"
description = "Simple TUI log viewer for python log files"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]

dependencies = [
    "aiofiles>=25.1.0",
    "textual==8.2.8",
]

[project.scripts]
logtui = "tui_log_viewer.runners.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "identify>=2.6.18",
    "prek>=0.4.10",
    "pytest-asyncio>=1.4.0",
]
